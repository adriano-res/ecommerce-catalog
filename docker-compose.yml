services:
  mongodb:
    image: mongo:7.0
    container_name: catalog-mongodb
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: catalog
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - mongodb_data:/data/db

  mongodb-init:
    image: mongo:7.0
    container_name: catalog-mongodb-init
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    command: >
      mongosh --host mongodb:27017 --eval '
        try {
          const status = rs.status();
          const currentHost = status.members && status.members[0] ? status.members[0].name : "";
          if (currentHost !== "localhost:27017") {
            console.log("Reconfiguring replica set host to localhost:27017...");
            const cfg = rs.conf();
            cfg.members[0].host = "localhost:27017";
            rs.reconfig(cfg, { force: true });
            console.log("Replica set reconfigured successfully.");
          } else {
            console.log("Replica set already initialized with localhost:27017.");
          }
        } catch (e) {
          console.log("Initializing replica set rs0 with localhost:27017...");
          rs.initiate({
            _id: "rs0",
            members: [{ _id: 0, host: "localhost:27017" }]
          });
          console.log("Replica set rs0 initialized.");
        }
      '

  redis:
    image: redis:7.4-alpine
    container_name: catalog-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: catalog-seaweedfs
    restart: unless-stopped
    command: "server -s3 -dir=/data -s3.port=8333"
    ports:
      - "8333:8333"
      - "9333:9333"
    volumes:
      - seaweedfs_data:/data

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: catalog-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  loki:
    image: grafana/loki:3.1.1
    container_name: catalog-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

  promtail:
    image: grafana/promtail:3.1.1
    container_name: catalog-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.2.0
    container_name: catalog-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  mongodb_data:
  redis_data:
  seaweedfs_data:
  prometheus_data:
  loki_data:
  grafana_data:
